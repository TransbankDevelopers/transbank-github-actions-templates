name: Comment Plugin Artifact Link on PR

on:
  workflow_call:
    inputs:
      pr_number:
        description: Pull request number to comment on.
        required: true
        type: string
      source_repo_full_name:
        description: Full name of the PR source repository.
        required: true
        type: string
      artifact_url:
        description: URL of the uploaded GitHub Actions artifact.
        required: true
        type: string
      artifact_name:
        description: Display name for the artifact link.
        required: false
        type: string
        default: plugin.zip
      comment_marker:
        description: Hidden marker used to update the same PR comment on every run.
        required: false
        type: string
        default: '<!-- plugin-artifact-link -->'
      comment_prefix:
        description: Visible text shown before the artifact link.
        required: false
        type: string
        default: 'Build listo'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: plugin-pr-artifact-comment-${{ github.repository }}-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  comment:
    runs-on: ubuntu-latest

    steps:
      - name: Comment PR with artifact link
        if: inputs.source_repo_full_name == github.repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          ARTIFACT_URL: ${{ inputs.artifact_url }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          COMMENT_MARKER: ${{ inputs.comment_marker }}
          COMMENT_PREFIX: ${{ inputs.comment_prefix }}
        run: |
          set -euo pipefail

          body="${COMMENT_MARKER}"$'\n'"${COMMENT_PREFIX}: [${ARTIFACT_NAME}](${ARTIFACT_URL})."

          comment_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --paginate \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains(env.COMMENT_MARKER))) | .id' \
            | head -n 1
          )"

          if [[ -n "${comment_id}" ]]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -f body="${body}"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="${body}"
          fi
